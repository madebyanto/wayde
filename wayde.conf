terminal = "foot"
log_level = "info"
focus_mode = "follows_mouse"
workspace_count = 10

[theme]
border_color_focused = "#5294e2"
border_color_unfocused = "#3a3f4b"
border_width = 2
gap = 6
font = "monospace 10"

[output]
width = 1280
height = 800
x = 0
y = 0
refresh = 60

[[keybinds]]
mods = ["super"]
key = "b"
action = "spawn"
arg = "firefox"

[[keybinds]]
mods = ["super"]
keycode = 10
action = "workspace"
arg = 1
